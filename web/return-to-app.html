<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Bloom G2W</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <style>
    :root {
      --royal-deep: #101C52;
      --royal: #1A2E7A;
      --sage: #2FA35C;
      --coral: #D1573F;
      --ink-soft: #6B7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--royal-deep);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      max-width: 420px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 32px;
      color: #fff;
    }
    .icon.success { background: var(--sage); }
    .icon.cancelled { background: var(--coral); }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 800;
      color: var(--royal-deep);
    }
    p {
      margin: 0 0 4px;
      font-size: 14px;
      color: var(--ink-soft);
      line-height: 1.5;
    }
    .instruction {
      margin-top: 20px;
      padding: 14px 16px;
      background: #F3F4FA;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--royal);
    }
    .brand {
      margin-top: 28px;
      font-size: 12px;
      font-weight: 800;
      color: var(--royal-deep);
      letter-spacing: 0.3px;
    }
    .brand span { color: #C8A13A; }
  </style>
</head>
<body>
  <div class="card">
    <div id="icon" class="icon"></div>
    <h1 id="headline"></h1>
    <p id="message"></p>
    <div class="instruction">
      ✅ You can close this browser tab now and switch back to the Bloom G2W app — it's already showing your up-to-date contribution status.
    </div>
    <div class="brand">Bloom<span>G2</span>W</div>
  </div>
  <script>
    var isCancelled = window.location.pathname.indexOf('donation-cancelled') !== -1;
    var icon = document.getElementById('icon');
    var headline = document.getElementById('headline');
    var message = document.getElementById('message');
    if (isCancelled) {
      icon.className = 'icon cancelled';
      icon.textContent = '✕';
      headline.textContent = 'Checkout Cancelled';
      message.textContent = 'No charge was made.';
    } else {
      icon.className = 'icon success';
      icon.textContent = '✓';
      headline.textContent = 'Payment Received';
      message.textContent = "Thank you! We're confirming your contribution now.";
    }
  </script>
</body>
</html>
